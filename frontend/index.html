<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shadowbid2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>ShadowBid</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent "Cannot redefine property: ethereum" crash from conflicting wallet extensions
      try {
        if (!window.ethereum) {
          Object.defineProperty(window, 'ethereum', {
            value: undefined, writable: true, configurable: true
          });
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
